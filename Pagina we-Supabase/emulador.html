<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📱 Emulador de Celular - Sistema de Asistencia QR</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at 50% 15%, #1e293b 0%, #070d18 100%);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
    }
    
    /* Chasis del Celular que se escala y cabe siempre en cualquier pantalla sin cortarse */
    .phone-container {
      height: calc(100vh - 65px);
      max-height: 750px;
      aspect-ratio: 385 / 800;
      position: relative;
      background: #020617;
      border: 10px solid #1e293b;
      border-radius: 44px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8),
                  0 0 0 1px rgba(255, 255, 255, 0.1),
                  inset 0 0 0 2px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Altavoz superior y lente integrados en el bisel (NUNCA tapan la pantalla) */
    .phone-bezel-top {
      height: 22px;
      background: #090d16;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .speaker {
      width: 44px;
      height: 3.5px;
      background: #334155;
      border-radius: 4px;
    }
    .lens {
      width: 7px;
      height: 7px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 50%;
      position: absolute;
      right: 36px;
    }

    /* Pantalla interna */
    .phone-screen {
      flex: 1;
      width: 100%;
      border: none;
      background: #020617;
    }

    /* Barra Home inferior */
    .phone-bezel-bottom {
      height: 16px;
      background: #090d16;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .home-bar {
      width: 110px;
      height: 4px;
      background: rgba(255, 255, 255, 0.35);
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <!-- Barra de Control Superior Compacta -->
  <header class="w-full max-w-lg flex items-center justify-between gap-3 px-3 py-1.5 rounded-xl bg-slate-900/90 border border-slate-800 shadow-md text-xs">
    <div class="flex items-center gap-2">
      <div class="w-6 h-6 rounded-lg bg-blue-600/20 text-blue-400 flex items-center justify-center font-bold text-xs">
        <i class="fa-solid fa-mobile-screen"></i>
      </div>
      <div>
        <h1 class="font-bold text-white text-xs leading-none">Emulador de Celular</h1>
        <p class="text-[10px] text-slate-400">Vista completa para teléfonos móviles</p>
      </div>
    </div>

    <!-- Botones de Acceso Rápido a las secciones del Celular -->
    <div class="flex items-center gap-1 bg-slate-950 p-1 rounded-lg border border-slate-800 text-[11px]">
      <button onclick="cambiarPestanaCelular('asistentes')" id="btnTabAsistentes" class="px-2.5 py-1 rounded font-bold text-blue-400 bg-blue-500/15 transition flex items-center gap-1">
        <i class="fa-solid fa-users"></i>
        <span>Asistentes</span>
      </button>
      <button onclick="cambiarPestanaCelular('escaner')" id="btnTabEscaner" class="px-2.5 py-1 rounded text-slate-400 hover:text-white transition flex items-center gap-1">
        <i class="fa-solid fa-camera"></i>
        <span>Escáner</span>
      </button>
      <button onclick="cambiarPestanaCelular('resumen')" id="btnTabResumen" class="px-2.5 py-1 rounded text-slate-400 hover:text-white transition flex items-center gap-1">
        <i class="fa-solid fa-chart-pie"></i>
        <span>Resumen</span>
      </button>
    </div>

    <button onclick="recargarPantalla()" class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs transition" title="Reiniciar vista del celular">
      <i class="fa-solid fa-rotate-right"></i>
    </button>
  </header>

  <!-- Chasis del Teléfono (Se ajusta 100% al alto de tu monitor) -->
  <main class="flex-1 flex items-center justify-center w-full my-1 overflow-hidden">
    <div class="phone-container">
      
      <!-- Bisel Superior (Con altavoz y cámara sin tapar la pantalla) -->
      <div class="phone-bezel-top">
        <div class="speaker"></div>
        <div class="lens"></div>
      </div>

      <!-- Pantalla donde corre la aplicación móvil celular.html adaptada -->
      <iframe id="iframeApp" src="celular.html" class="phone-screen"></iframe>

      <!-- Bisel Inferior con barra Home -->
      <div class="phone-bezel-bottom">
        <div class="home-bar"></div>
      </div>
    </div>
  </main>

  <!-- Pie con indicación -->
  <footer class="text-[11px] text-slate-500 text-center flex-shrink-0">
    Todo lo que marques aquí se sincroniza en vivo con el Excel y con Firebase
  </footer>

  <script>
    function cambiarPestanaCelular(pestana) {
      const iframe = document.getElementById("iframeApp");
      if (iframe && iframe.contentWindow) {
        if (pestana === "asistentes") {
          if (iframe.contentWindow.cambiarPestana) iframe.contentWindow.cambiarPestana('asistentes');
          else if (iframe.contentWindow.cambiarVista) iframe.contentWindow.cambiarVista('tabla');
        } else if (pestana === "escaner") {
          if (iframe.contentWindow.cambiarPestana) iframe.contentWindow.cambiarPestana('escaner');
          else if (iframe.contentWindow.cambiarVista) iframe.contentWindow.cambiarVista('escaner');
        } else if (pestana === "resumen") {
          if (iframe.contentWindow.cambiarPestana) iframe.contentWindow.cambiarPestana('resumen');
        }
      }

      // Estilo de botones
      const btns = {
        asistentes: document.getElementById("btnTabAsistentes"),
        escaner: document.getElementById("btnTabEscaner"),
        resumen: document.getElementById("btnTabResumen")
      };

      Object.keys(btns).forEach(k => {
        if (k === pestana) {
          btns[k].className = "px-2.5 py-1 rounded font-bold text-blue-400 bg-blue-500/15 transition flex items-center gap-1";
        } else {
          btns[k].className = "px-2.5 py-1 rounded text-slate-400 hover:text-white transition flex items-center gap-1";
        }
      });
    }

    function recargarPantalla() {
      const iframe = document.getElementById("iframeApp");
      if (iframe) iframe.contentWindow.location.reload();
    }
  </script>
</body>
</html>
